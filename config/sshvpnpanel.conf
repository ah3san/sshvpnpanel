# =============================================================================
# SSH VPN Panel - Main Configuration File
# =============================================================================
# Edit this file to customize your SSH VPN Panel settings.
# Lines starting with '#' are comments and are ignored.
# =============================================================================

# -----------------------------------------------------------------------------
# GENERAL SETTINGS
# -----------------------------------------------------------------------------

# Panel version (do not modify)
PANEL_VERSION="1.0.0"

# Panel name displayed in the UI
PANEL_NAME="SSH VPN Panel"

# Admin username for panel authentication
ADMIN_USER="admin"

# Admin password hash (SHA-256). Default: "admin123"
# Generate new hash: echo -n "yourpassword" | sha256sum | awk '{print $1}'
ADMIN_PASSWORD_HASH="240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"

# Session timeout in minutes (0 = no timeout)
SESSION_TIMEOUT=30

# -----------------------------------------------------------------------------
# DIRECTORY PATHS
# -----------------------------------------------------------------------------

# Base directory for the panel
PANEL_BASE_DIR="/etc/sshvpnpanel"

# User data directory
USER_DATA_DIR="${PANEL_BASE_DIR}/users"

# Logs directory
LOG_DIR="/var/log/sshvpnpanel"

# Backup directory
BACKUP_DIR="/var/backups/sshvpnpanel"

# SSL certificates directory
CERT_DIR="${PANEL_BASE_DIR}/certs"

# Stunnel configuration directory
STUNNEL_DIR="${PANEL_BASE_DIR}/stunnel"

# Temporary files directory
TMP_DIR="/tmp/sshvpnpanel"

# -----------------------------------------------------------------------------
# SSH SETTINGS
# -----------------------------------------------------------------------------

# SSH service name (sshd on most systems)
SSH_SERVICE="sshd"

# SSH port (default: 22)
SSH_PORT=22

# SSH configuration file
SSH_CONFIG="/etc/ssh/sshd_config"

# Default shell for VPN users (use /bin/false or /usr/sbin/nologin to restrict)
VPN_USER_SHELL="/bin/false"

# Default SSH user expiration in days (0 = no expiration)
DEFAULT_SSH_EXPIRY_DAYS=30

# Maximum concurrent SSH connections per user
MAX_CONNECTIONS_PER_USER=2

# SSH banner file path (leave empty to disable)
SSH_BANNER_FILE="${PANEL_BASE_DIR}/ssh_banner"

# Enable TCP forwarding for SSH users (yes/no)
SSH_TCP_FORWARDING="yes"

# -----------------------------------------------------------------------------
# STUNNEL SETTINGS
# -----------------------------------------------------------------------------

# Stunnel service name
STUNNEL_SERVICE="stunnel4"

# Stunnel configuration file
STUNNEL_CONFIG="/etc/stunnel/stunnel.conf"

# Default Stunnel SSL port
STUNNEL_SSL_PORT=443

# Stunnel PID file
STUNNEL_PID_FILE="/var/run/stunnel4/stunnel4.pid"

# Stunnel log file
STUNNEL_LOG_FILE="/var/log/stunnel4/stunnel4.log"

# Auto-restart Stunnel on failure (yes/no)
STUNNEL_AUTO_RESTART="yes"

# Stunnel restart check interval in seconds
STUNNEL_CHECK_INTERVAL=60

# -----------------------------------------------------------------------------
# TLS/SNI SETTINGS
# -----------------------------------------------------------------------------

# Default TLS version (1.2 or 1.3)
DEFAULT_TLS_VERSION="1.3"

# Certificate renewal threshold in days (renew before expiry)
CERT_RENEW_DAYS=30

# Default certificate validity in days (for self-signed)
DEFAULT_CERT_DAYS=365

# ACME/Let's Encrypt email for certificate requests
ACME_EMAIL=""

# Enable SNI routing (yes/no)
ENABLE_SNI="yes"

# SNI routing configuration file
SNI_CONFIG="${PANEL_BASE_DIR}/sni_routes.conf"

# -----------------------------------------------------------------------------
# VPN SETTINGS
# -----------------------------------------------------------------------------

# VPN type (ssh/stunnel/both)
VPN_TYPE="both"

# Default bandwidth limit in KB/s (0 = unlimited)
DEFAULT_BANDWIDTH_LIMIT=0

# Default VPN user expiration in days (0 = no expiration)
DEFAULT_VPN_EXPIRY_DAYS=30

# Enable traffic monitoring (yes/no)
ENABLE_TRAFFIC_MONITORING="yes"

# Traffic monitoring database
TRAFFIC_DB="${PANEL_BASE_DIR}/traffic.db"

# Auto-cleanup expired users (yes/no)
AUTO_CLEANUP_EXPIRED="yes"

# Cleanup check interval in hours
CLEANUP_INTERVAL=24

# -----------------------------------------------------------------------------
# MONITORING SETTINGS
# -----------------------------------------------------------------------------

# Enable system monitoring (yes/no)
ENABLE_MONITORING="yes"

# Monitoring refresh interval in seconds
MONITOR_REFRESH=5

# CPU usage alert threshold (%)
CPU_ALERT_THRESHOLD=90

# Memory usage alert threshold (%)
MEMORY_ALERT_THRESHOLD=90

# Disk usage alert threshold (%)
DISK_ALERT_THRESHOLD=85

# Bandwidth alert threshold in Mbps (0 = disabled)
BANDWIDTH_ALERT_THRESHOLD=0

# Enable email alerts (yes/no)
ENABLE_EMAIL_ALERTS="no"

# Alert email address
ALERT_EMAIL=""

# -----------------------------------------------------------------------------
# SECURITY SETTINGS
# -----------------------------------------------------------------------------

# Enable fail2ban integration (yes/no)
ENABLE_FAIL2BAN="yes"

# Maximum failed login attempts before lockout
MAX_LOGIN_ATTEMPTS=5

# Lockout duration in minutes
LOCKOUT_DURATION=30

# Enable IP whitelist (yes/no) - only whitelisted IPs can connect
ENABLE_IP_WHITELIST="no"

# IP whitelist file
IP_WHITELIST_FILE="${PANEL_BASE_DIR}/ip_whitelist.conf"

# IP blacklist file
IP_BLACKLIST_FILE="${PANEL_BASE_DIR}/ip_blacklist.conf"

# Enable audit logging (yes/no)
ENABLE_AUDIT_LOG="yes"

# Audit log file
AUDIT_LOG="${LOG_DIR}/audit.log"

# Enable firewall management (yes/no)
ENABLE_FIREWALL="yes"

# Firewall backend (iptables/ufw/firewalld)
FIREWALL_BACKEND="iptables"

# -----------------------------------------------------------------------------
# LOGGING SETTINGS
# -----------------------------------------------------------------------------

# Log level (DEBUG/INFO/WARN/ERROR)
LOG_LEVEL="INFO"

# Main log file
MAIN_LOG="${LOG_DIR}/sshvpnpanel.log"

# Error log file
ERROR_LOG="${LOG_DIR}/error.log"

# Log rotation size in MB
LOG_ROTATE_SIZE=50

# Number of rotated log files to keep
LOG_ROTATE_KEEP=10

# Enable syslog integration (yes/no)
ENABLE_SYSLOG="no"

# -----------------------------------------------------------------------------
# BACKUP SETTINGS
# -----------------------------------------------------------------------------

# Enable automatic backups (yes/no)
AUTO_BACKUP="yes"

# Backup frequency (daily/weekly/monthly)
BACKUP_FREQUENCY="daily"

# Number of backups to retain
BACKUP_RETAIN=7

# Backup encryption (yes/no)
BACKUP_ENCRYPTION="no"

# Backup encryption passphrase (if encryption enabled)
BACKUP_PASSPHRASE=""

# Remote backup (yes/no)
REMOTE_BACKUP="no"

# Remote backup destination (scp format: user@host:/path)
REMOTE_BACKUP_DEST=""

# -----------------------------------------------------------------------------
# ROLE-BASED ACCESS CONTROL
# -----------------------------------------------------------------------------

# Available roles: admin, operator, viewer
# admin: full access
# operator: manage users, view monitoring
# viewer: read-only access

# Default new admin role
DEFAULT_ADMIN_ROLE="admin"

# -----------------------------------------------------------------------------
# MULTI-DISTRIBUTION SETTINGS
# -----------------------------------------------------------------------------

# Package manager (auto-detected if empty)
PKG_MANAGER=""

# Service manager (auto-detected if empty: systemd/sysvinit/openrc)
SERVICE_MANAGER=""

# Network interface for bandwidth monitoring (auto-detected if empty)
NETWORK_INTERFACE=""
