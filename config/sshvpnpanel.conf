################################################################################
# SSH VPN Panel - Main Configuration File
# /etc/sshvpnpanel/sshvpnpanel.conf
################################################################################

# Panel Settings
PANEL_NAME="SSH VPN Panel"
PANEL_VERSION="1.0.0"
PANEL_ADMIN_EMAIL="admin@example.com"
PANEL_LOG_DIR="/var/log/sshvpnpanel"
PANEL_DATA_DIR="/var/lib/sshvpnpanel"
PANEL_CONFIG_DIR="/etc/sshvpnpanel"
PANEL_BACKUP_DIR="/var/backups/sshvpnpanel"

# SSH Settings
SSH_PORT=22
SSH_CONFIG="/etc/ssh/sshd_config"
SSH_AUTHORIZED_KEYS_DIR="/home/%s/.ssh"
SSH_DEFAULT_SHELL="/bin/bash"
SSH_MAX_SESSIONS=2
SSH_DEFAULT_QUOTA_MB=1024
SSH_DEFAULT_EXPIRE_DAYS=30

# Stunnel Settings
STUNNEL_ENABLED=true
STUNNEL_CONFIG_DIR="/etc/stunnel"
STUNNEL_CERT_DIR="/etc/stunnel/certs"
STUNNEL_PORT_RANGE_START=10443
STUNNEL_PORT_RANGE_END=20443
STUNNEL_DEFAULT_PORT=443
STUNNEL_SERVICE="stunnel4"

# TLS/SNI Settings
TLS_ENABLED=true
TLS_CERT_DIR="/etc/ssl/sshvpnpanel"
TLS_CA_FILE="/etc/ssl/sshvpnpanel/ca.pem"
TLS_DEFAULT_DAYS=365
TLS_KEY_SIZE=4096
SNI_ENABLED=true
SNI_DEFAULT_DOMAIN="vpn.example.com"

# VPN Settings
VPN_ENABLED=true
VPN_CONFIG_DIR="/etc/sshvpnpanel/vpn"
VPN_DATA_DIR="/var/lib/sshvpnpanel/vpn"
VPN_DEFAULT_DNS="8.8.8.8,8.8.4.4"
VPN_DEFAULT_SUBNET="10.8.0.0/24"

# Firewall Settings
FIREWALL_ENABLED=true
FIREWALL_BACKEND="iptables"   # iptables or ufw
FIREWALL_DEFAULT_POLICY="DROP"
FIREWALL_WHITELIST_FILE="/etc/sshvpnpanel/firewall_whitelist.conf"

# Bandwidth Monitoring
BANDWIDTH_MONITORING=true
BANDWIDTH_LIMIT_DEFAULT_MB=10240
BANDWIDTH_MONITOR_TOOL="vnstat"
BANDWIDTH_REPORT_DIR="/var/lib/sshvpnpanel/bandwidth"

# Logging Settings
LOG_LEVEL="INFO"             # DEBUG, INFO, WARN, ERROR
LOG_ROTATE_DAYS=30
LOG_AUDIT_FILE="${PANEL_LOG_DIR}/audit.log"
LOG_ACCESS_FILE="${PANEL_LOG_DIR}/access.log"
LOG_ERROR_FILE="${PANEL_LOG_DIR}/error.log"

# Email Notifications
EMAIL_ENABLED=false
EMAIL_SMTP_HOST="smtp.example.com"
EMAIL_SMTP_PORT=587
EMAIL_SMTP_USER="noreply@example.com"
EMAIL_SMTP_PASS=""
EMAIL_FROM="SSH VPN Panel <noreply@example.com>"

# User Defaults
USER_DEFAULT_GROUP="sshvpn"
USER_HOME_BASE="/home"
USER_SHELL_DEFAULT="/bin/bash"
USER_EXPIRE_DEFAULT_DAYS=30
USER_QUOTA_DEFAULT_MB=1024
USER_MAX_CONNECTIONS=2
USER_TEMPLATE_DIR="${PANEL_CONFIG_DIR}/templates"

# Security Settings
SECURITY_FAIL2BAN_ENABLED=true
SECURITY_MAX_AUTH_TRIES=3
SECURITY_LOGIN_GRACE_TIME=30
SECURITY_PERMIT_ROOT_LOGIN="no"
SECURITY_PASSWORD_AUTH="yes"
SECURITY_PUBKEY_AUTH="yes"

# Backup Settings
BACKUP_ENABLED=true
BACKUP_SCHEDULE="0 2 * * *"   # Daily at 2 AM (cron format)
BACKUP_RETENTION_DAYS=7
BACKUP_COMPRESS=true

# Archive Settings (for user removal)
ARCHIVE_REMOVED_USERS=true
ARCHIVE_DIR="/var/backups/sshvpnpanel/archived_users"
ARCHIVE_RETENTION_DAYS=90
