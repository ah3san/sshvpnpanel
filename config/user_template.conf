################################################################################
# SSH VPN Panel - User Template Configuration
# Copy this file to create custom user templates
################################################################################

# Template metadata
TEMPLATE_NAME="default"
TEMPLATE_DESCRIPTION="Default user template"
TEMPLATE_VERSION="1.0"

# Account settings
EXPIRE_DAYS=30
MAX_CONNECTIONS=2
QUOTA_MB=1024
BANDWIDTH_LIMIT_MB=10240

# SSH settings
SSH_ENABLED=true
SSH_KEY_TYPE="ed25519"       # ed25519 or rsa
SSH_KEY_BITS=4096            # for RSA keys
SSH_ALLOW_PASSWORD=true
SSH_ALLOW_PUBKEY=true

# Stunnel settings
STUNNEL_ENABLED=true
STUNNEL_PORT=443
STUNNEL_SNI_ENABLED=true

# TLS settings
TLS_CERT_ENABLED=true
TLS_CERT_DAYS=365

# Firewall settings
FIREWALL_WHITELIST=true
FIREWALL_RATE_LIMIT=true

# VPN settings
VPN_ENABLED=true
VPN_DNS="8.8.8.8,8.8.4.4"

# Monitoring settings
MONITORING_ENABLED=true
LOGGING_ENABLED=true

# Notification settings
SEND_WELCOME_EMAIL=false
SEND_EXPIRY_WARNING=false
EXPIRY_WARNING_DAYS=5

# Shell settings
SHELL="/bin/bash"
HOME_DIR_QUOTA_MB=500
