# =============================================================================
# SSH VPN Panel - Security Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# ALLOWED PORTS
# -----------------------------------------------------------------------------
# Format: PORT/PROTOCOL (e.g., 22/tcp, 443/tcp)
# These ports will be opened in the firewall

ALLOWED_PORTS=(
    "22/tcp"       # SSH
    "443/tcp"      # HTTPS / Stunnel SSL
    "80/tcp"       # HTTP (for Let's Encrypt challenges)
    "8080/tcp"     # Websocket / Alternative port
    "8443/tcp"     # Alternative HTTPS
    "1194/udp"     # OpenVPN (if used)
)

# -----------------------------------------------------------------------------
# BLOCKED PORTS
# -----------------------------------------------------------------------------
# These ports will be explicitly blocked in the firewall

BLOCKED_PORTS=(
    "23/tcp"       # Telnet
    "135/tcp"      # Windows RPC
    "137/tcp"      # NetBIOS
    "138/udp"      # NetBIOS
    "139/tcp"      # NetBIOS
    "445/tcp"      # SMB
    "3389/tcp"     # RDP
)

# -----------------------------------------------------------------------------
# IP WHITELIST
# -----------------------------------------------------------------------------
# IPs that are always allowed (one per line)
# Supports CIDR notation (e.g., 192.168.1.0/24)

WHITELISTED_IPS=(
    "127.0.0.1"
    "::1"
)

# -----------------------------------------------------------------------------
# IP BLACKLIST
# -----------------------------------------------------------------------------
# IPs that are always blocked

BLACKLISTED_IPS=(
)

# -----------------------------------------------------------------------------
# RATE LIMITING
# -----------------------------------------------------------------------------

# SSH rate limiting (connections per minute per IP)
SSH_RATE_LIMIT=10

# HTTP/HTTPS rate limiting (requests per minute per IP)
HTTP_RATE_LIMIT=100

# Enable port scan detection (yes/no)
ENABLE_PORT_SCAN_DETECTION="yes"

# Port scan detection window (seconds)
PORT_SCAN_WINDOW=60

# Port scan detection threshold (number of ports)
PORT_SCAN_THRESHOLD=10

# -----------------------------------------------------------------------------
# FAIL2BAN INTEGRATION
# -----------------------------------------------------------------------------

# Fail2ban SSH jail configuration
F2B_SSH_MAX_RETRY=5
F2B_SSH_FINDTIME=600
F2B_SSH_BANTIME=3600

# Fail2ban Stunnel jail configuration
F2B_STUNNEL_MAX_RETRY=10
F2B_STUNNEL_FINDTIME=600
F2B_STUNNEL_BANTIME=3600

# -----------------------------------------------------------------------------
# PANEL SECURITY
# -----------------------------------------------------------------------------

# Require password change on first login (yes/no)
REQUIRE_PASSWORD_CHANGE="yes"

# Minimum password length
MIN_PASSWORD_LENGTH=8

# Password complexity requirements (yes/no)
REQUIRE_PASSWORD_COMPLEXITY="yes"

# Session token length (bytes)
SESSION_TOKEN_LENGTH=32

# Enable two-factor authentication (yes/no)
ENABLE_2FA="no"
