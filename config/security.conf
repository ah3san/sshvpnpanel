################################################################################
# SSH VPN Panel - Security Configuration
################################################################################

# Fail2Ban settings
FAIL2BAN_SSH_MAXRETRY=3
FAIL2BAN_SSH_FINDTIME=600
FAIL2BAN_SSH_BANTIME=3600

# IPTables default policies
IPTABLES_INPUT_POLICY=DROP
IPTABLES_FORWARD_POLICY=DROP
IPTABLES_OUTPUT_POLICY=ACCEPT

# Allowed services (ports) - comma-separated
ALLOWED_TCP_PORTS="22,80,443,8080,8443"
ALLOWED_UDP_PORTS=""

# SSH hardening
SSH_PERMIT_EMPTY_PASSWORDS=no
SSH_X11_FORWARDING=no
SSH_TCP_KEEPALIVE=yes
SSH_CLIENT_ALIVE_INTERVAL=300
SSH_CLIENT_ALIVE_COUNT_MAX=3
SSH_MAX_AUTH_TRIES=3
SSH_MAX_SESSIONS=2
SSH_LOGIN_GRACE_TIME=30

# Connection rate limiting
RATE_LIMIT_ENABLED=true
RATE_LIMIT_SSH_CONNECTIONS_PER_MIN=5
RATE_LIMIT_SSH_BURST=10

# Geo-blocking (disabled by default)
GEO_BLOCKING_ENABLED=false
GEO_ALLOWED_COUNTRIES="ALL"
GEO_BLOCKED_COUNTRIES=""

# Port knocking (disabled by default)
PORT_KNOCKING_ENABLED=false
PORT_KNOCKING_SEQUENCE="7000,8000,9000"
PORT_KNOCKING_TIMEOUT=10

# IDS/IPS Integration
IDS_ENABLED=false
IDS_TOOL="suricata"   # suricata or snort
